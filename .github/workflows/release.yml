name: release

# Push a tag like v0.1.0 to build OneCorp for Apple silicon and Intel Macs, signed with the
# Developer ID and notarized by Apple, so it opens with no warning. The release is published
# with its notes from CHANGELOG.md, then the Homebrew cask points at it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p onecorp -p onecorp-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Also what the build below needs: Tauri runs npm run build in app/ before bundling.
      - run: npm ci
        working-directory: app
      - run: node app/tests/ui-smoke.js
      - run: node app/tests/onboarding.mjs

      # The same certificate and notary key as the org's other Mac apps.
      - name: Import the signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "The DEVELOPER_ID_P12 secret isn't shared with this repo. Add onecorp to it in the org's secrets." >&2; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
          [ -n "$identity" ] || { echo "No Developer ID Application identity in the certificate." >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          APPLE_API_KEY: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          # Signs the update that installed apps download. Its public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "The TAURI_SIGNING_PRIVATE_KEY secret is missing, so updates can't be signed." >&2; exit 1; }
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/notary.p8"
          cargo install tauri-cli --version "^2" --locked
          # Updater artifacts only here: a local build has no signing key.
          cd app && cargo tauri build --target universal-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":true}}'
          # Tauri notarizes the app. The disk image is ours, laid out for drag to Applications, and
          # gets its own ticket so it opens offline too.
          dmg="$RUNNER_TEMP/OneCorp.dmg"
          ../scripts/dmg.sh ../target/universal-apple-darwin/release/bundle/macos/OneCorp.app "$dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          mkdir -p "$RUNNER_TEMP/out" && cp "$dmg" "$RUNNER_TEMP/out/OneCorp.dmg"
          # The update: the notarized app, compressed and signed.
          cp ../target/universal-apple-darwin/release/bundle/macos/OneCorp.app.tar.gz "$RUNNER_TEMP/out/"
          cp ../target/universal-apple-darwin/release/bundle/macos/OneCorp.app.tar.gz.sig "$RUNNER_TEMP/out/"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          # Tags like v0.2.0-beta become pre-releases.
          prerelease=$([[ "$version" == *-* ]] && echo "--prerelease" || true)
          # What installed apps read to update: one universal build serves both kinds of Mac.
          # They fetch it from releases/latest, so pre-releases never reach them.
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/OneCorp.app.tar.gz"
          jq -n --arg v "$version" --arg notes "$(cat "$RUNNER_TEMP/notes.md")" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat "$RUNNER_TEMP/out/OneCorp.app.tar.gz.sig")" --arg url "$url" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {"darwin-aarch64": {signature: $sig, url: $url}, "darwin-x86_64": {signature: $sig, url: $url}}}' \
            > "$RUNNER_TEMP/out/latest.json"
          # A fixed name keeps releases/latest/download/OneCorp.dmg working as a direct link.
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/out/OneCorp.dmg" "$RUNNER_TEMP/out/OneCorp.app.tar.gz" "$RUNNER_TEMP/out/latest.json" \
            --title "OneCorp $version" --notes-file "$RUNNER_TEMP/notes.md" $prerelease

  # A job of its own, so a failed bump can be re-run without publishing the release again.
  # It can't be a workflow on release published: a release made with github.token starts no other workflow.
  cask:
    needs: macos
    # Pre-releases stay out of the tap, so brew only offers stable versions.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern OneCorp.dmg --dir "$RUNNER_TEMP"
          ./scripts/bump-cask.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/OneCorp.dmg"
