[workspace]
members = ["crates/core", "crates/cli", "app"]
resolver = "3"

[workspace.package]
version = "0.1.8"
edition = "2024"
license = "MIT"
repository = "https://github.com/snowztech/onecorp"
homepage = "https://github.com/snowztech/onecorp"

[workspace.dependencies]
onecorp = { path = "crates/core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"
