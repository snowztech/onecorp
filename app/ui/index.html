<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneCorp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="side" id="side" aria-label="Companies and pages"></nav>
    <main>
      <header class="topbar" data-tauri-drag-region>
        <div class="titles"><h1 id="title">OneCorp</h1></div>
        <button class="btn primary new-ticket" id="new-ticket" data-new-ticket="1" hidden>New ticket <kbd>⌘K</kbd></button>
      </header>
      <div class="view" id="view"></div>
    </main>
  </div>
  <div class="pop" id="pop" hidden></div>
  <div class="sheet-bg" id="sheet" hidden></div>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
