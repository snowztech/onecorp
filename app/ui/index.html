<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneCorp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="side" id="side" aria-label="Companies and pages"></nav>
    <main>
      <header class="topbar" data-tauri-drag-region>
        <button class="rail-btn" data-rail="1" title="Collapse the sidebar (⌘B)" aria-label="Toggle the sidebar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
        <div class="titles"><h1 id="title">OneCorp</h1></div>
        <button class="top-spend" id="top-spend" data-settings-tab="spend" hidden></button>
        <button class="btn new-ticket" id="new-ticket" data-new-ticket="1" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New ticket <kbd>⌘K</kbd></button>
      </header>
      <div class="paused-bar" id="paused" hidden></div>
      <div class="view" id="view"></div>
    </main>
  </div>
  <div class="pop" id="pop" hidden></div>
  <div class="sheet-bg" id="sheet" hidden></div>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="toast" id="toast" role="status"></div>
  <script src="brand.js"></script>
  <script src="app.js"></script>
</body>
</html>
