<title>OneCorp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: desktop app shell. Sidebar nav, main view, right drawer for people and tickets. */
:root {
  --bg: #e9ebef; --surface: #fbfbfc; --surface-2: #f2f3f6; --line: #dcdfe5;
  --fg: #15171c; --muted: #5f6573; --accent: #2b55c9; --accent-soft: #e3e9fa;
  --signal: #b8641a; --signal-soft: #fbeedd; --good: #1f8a55; --good-soft: #def2e7;
  --bad: #c0392b; --term-bg: #12151b; --term-fg: #cfd5df; --term-dim: #7d8696; --term-ok: #6fcf97; --term-err: #ff8a7a; --term-cmd: #8fb0ff;
  --display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d0f13; --surface: #161920; --surface-2: #1c2029; --line: #2a2f3a;
  --fg: #e6e8ed; --muted: #8d94a3; --accent: #7596ff; --accent-soft: #1e2845;
  --signal: #f0a35c; --signal-soft: #3a2a19; --good: #5ccf8f; --good-soft: #17301f; --bad: #ff7b6b;
  --term-bg: #0a0c10; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d0f13; --surface: #161920; --surface-2: #1c2029; --line: #2a2f3a;
  --fg: #e6e8ed; --muted: #8d94a3; --accent: #7596ff; --accent-soft: #1e2845;
  --signal: #f0a35c; --signal-soft: #3a2a19; --good: #5ccf8f; --good-soft: #17301f; --bad: #ff7b6b;
  --term-bg: #0a0c10; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; box-sizing: border-box; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }

.window { height: 100%; min-height: 560px; max-width: 1400px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; overflow: hidden; display: grid; grid-template-rows: 38px 1fr; box-shadow: 0 20px 50px -30px rgba(0,0,0,.35); position: relative; }
.titlebar { display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.dot { width: 11px; height: 11px; border-radius: 50%; background: var(--line); }
.titlebar .name { margin-left: 10px; font-size: 12px; color: var(--muted); }
.app { display: grid; grid-template-columns: 210px 1fr; min-height: 0; }

nav.side { border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; background: var(--surface-2); min-height: 0; overflow: auto; }
.company { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.logo { width: 28px; height: 28px; border-radius: 7px; background: var(--fg); color: var(--surface); display: grid; place-items: center; font-family: var(--display); font-weight: 700; }
.company b { font-family: var(--display); font-size: 15px; display: block; }
.company span { font-size: 12px; color: var(--muted); }
.navbtn { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 7px 10px; border: 0; background: transparent; border-radius: 7px; text-align: left; color: var(--muted); }
.navbtn:hover { background: var(--surface); color: var(--fg); }
.navbtn[aria-current="page"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.badge { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 99px; background: var(--signal-soft); color: var(--signal); font-variant-numeric: tabular-nums; }
.side h6 { margin: 16px 10px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.side .person { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border: 0; background: transparent; border-radius: 7px; width: 100%; text-align: left; font-size: 13px; }
.side .person:hover { background: var(--surface); }

main { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
.topbar { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.topbar h1 { font-family: var(--display); font-size: 20px; margin: 0; letter-spacing: -.01em; }
.spacer { flex: 1; }
.budget { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { width: 120px; height: 6px; border-radius: 99px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.bar.hot > i { background: var(--signal); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 7px; font-weight: 500; font-size: 13px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.btn.good { background: var(--good); color: #fff; border-color: var(--good); }
.view { overflow: auto; padding: 20px; min-height: 0; }

.av { flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 12px; position: relative; }
.av .st { position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--surface); }
.st.working { background: var(--good); } .st.blocked { background: var(--signal); } .st.idle { background: var(--muted); } .st.paused { background: var(--line); }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px transparent; } 0% { box-shadow: 0 0 0 0 var(--good); } }
.st.working { animation: pulse 1.8s infinite; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; padding: 1px 7px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip .rt { width: 7px; height: 7px; border-radius: 2px; }

/* Office */
.office { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; align-content: start; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; text-align: left; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card .head { display: flex; gap: 10px; align-items: center; }
.card .head b { display: block; font-size: 14px; }
.card .head span { font-size: 12px; color: var(--muted); }
.card .now { font-size: 13px; min-height: 38px; }
.card .now .tid { font-family: var(--mono); font-size: 11px; color: var(--accent); }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .bar { width: 70px; }
.card.hire { border-style: dashed; align-items: center; justify-content: center; color: var(--muted); min-height: 160px; background: transparent; }
.panel { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.panel h3 { margin: 0; padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.feed { list-style: none; margin: 0; padding: 6px 0; overflow: auto; max-height: 520px; }
.feed li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 7px 14px; font-size: 13px; }
.feed li time { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.feed li.new { animation: slide .35s ease-out; }
@keyframes slide { from { background: var(--accent-soft); } to { background: transparent; } }
.feed li.need { background: var(--signal-soft); }
.section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 10px; }
.section-h h2 { font-size: 13px; margin: 0; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.standup { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; background: var(--surface-2); }
.standup p { margin: 4px 0; font-size: 13px; }

/* Board */
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; min-height: 100%; align-items: start; }
.col { background: var(--surface-2); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 220px; }
.col h4 { margin: 2px 4px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; }
.tk { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.tk:hover { border-color: var(--accent); }
.tk .id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.tk .t { font-weight: 500; }
.tk .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.tk.needs { box-shadow: inset 3px 0 0 var(--signal); }

/* Chat */
.chat { display: grid; grid-template-columns: 190px minmax(0, 1fr); height: 100%; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.chans { background: var(--surface-2); padding: 10px 6px; border-right: 1px solid var(--line); overflow: auto; }
.chans button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 10px; border-radius: 6px; color: var(--muted); }
.chans button[aria-current="true"] { background: var(--surface); color: var(--fg); font-weight: 600; }
.msgs { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
.msglist { overflow: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; gap: 10px; }
.msg b { font-size: 13px; } .msg time { font-size: 11px; color: var(--muted); margin-left: 6px; font-family: var(--mono); }
.msg p { margin: 2px 0 0; max-width: 68ch; }
.msg .ref { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.compose { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.compose input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--surface); }

/* Inbox */
.inbox { display: flex; flex-direction: column; gap: 10px; max-width: 760px; }
.ask { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 12px; background: var(--surface); }
.ask .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--signal); }
.ask h4 { margin: 2px 0 4px; font-size: 15px; }
.ask p { margin: 0 0 10px; color: var(--muted); }
.ask .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.empty { padding: 40px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }

/* Hiring */
.hire-form { display: flex; gap: 8px; max-width: 760px; margin-bottom: 18px; flex-wrap: wrap; }
.hire-form input { flex: 1; min-width: 220px; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface); }
.cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; max-width: 980px; }
.cand { border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.cand .tier { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.cand q { font-style: italic; color: var(--muted); quotes: none; }
.cand dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13px; }
.cand dt { color: var(--muted); } .cand dd { margin: 0; font-variant-numeric: tabular-nums; }

/* Drawer */
.scrim { position: absolute; inset: 38px 0 0 0; background: rgba(10,12,16,.25); opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: absolute; top: 38px; right: 0; bottom: 0; width: min(500px, 100%); background: var(--surface); border-left: 1px solid var(--line);
  transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; min-height: 0; }
.drawer.open { transform: none; }
.dhead { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
.dhead h2 { font-family: var(--display); font-size: 20px; margin: 0; }
.dbody { overflow: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 18px; }
.dbody h5 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; font-size: 13px; align-items: center; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; }
.kv select { border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: var(--surface); }
.perm { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; gap: 10px; }
.perm:last-child { border: 0; }
.perm small { display: block; color: var(--muted); font-size: 12px; }
.term { background: var(--term-bg); color: var(--term-fg); font-family: var(--mono); font-size: 12px; border-radius: 8px; padding: 10px 12px; height: 220px; overflow: auto; line-height: 1.6; }
.term .c { color: var(--term-cmd); } .term .d { color: var(--term-dim); } .term .ok { color: var(--term-ok); } .term .err { color: var(--term-err); }
.term .cursor { display: inline-block; width: 7px; height: 13px; background: var(--term-fg); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.memory { margin: 0; padding-left: 18px; font-size: 13px; }
.memory li { margin: 3px 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: var(--surface-2); border-radius: 8px; padding: 10px; }
.stats b { display: block; font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.close { margin-left: auto; border: 0; background: transparent; font-size: 20px; color: var(--muted); padding: 4px 8px; border-radius: 6px; }
.close:hover { background: var(--surface-2); }
.artifact { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
.artifact .ic { width: 28px; height: 28px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--mono); font-size: 10px; font-weight: 600; }

.toast { position: absolute; left: 50%; bottom: 20px; transform: translate(-50%, 20px); background: var(--fg); color: var(--surface); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: all .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Floor: the office seen from above. Each desk is an employee, bubbles carry their voice. */
:root { --floor: #e2e5ea; --floor-dot: #cdd2da; --desk: #c7ad86; --desk-edge: #a88f69; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --floor: #11141a; --floor-dot: #232834; --desk: #5a4a36; --desk-edge: #3f3426; } }
:root[data-theme="dark"] { --floor: #11141a; --floor-dot: #232834; --desk: #5a4a36; --desk-edge: #3f3426; }
.brand { display: flex; align-items: center; gap: 7px; margin-left: 10px; font-family: var(--display); font-weight: 700; font-size: 13px; }
.mark { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); color: #fff; display: grid; place-items: center; font-style: normal; font-size: 11px; }
.avc { display: block; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; }
.avc svg { display: block; width: 100%; height: 100%; }
.floorwrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.floor { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; padding: 18px; border-radius: 14px;
  background-color: var(--floor); background-image: radial-gradient(var(--floor-dot) 1px, transparent 1.5px); background-size: 16px 16px; }
.desk { position: relative; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; padding: 46px 8px 12px; border-radius: 12px; transition: background .15s; }
.desk:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
.station { display: flex; align-items: flex-end; gap: 6px; position: relative; z-index: 1; }
.seat { display: block; }
.seat.ghost { width: 56px; height: 56px; border-radius: 50%; border: 2px dashed var(--muted); opacity: .5; }
.monitor { width: 64px; height: 44px; border-radius: 5px; background: var(--term-bg); border: 3px solid var(--fg); display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 6px; margin-bottom: 2px; }
.monitor i { display: block; height: 3px; border-radius: 2px; background: var(--term-dim); opacity: .5; transform-origin: left; }
.monitor i:nth-child(1) { width: 70%; } .monitor i:nth-child(2) { width: 45%; margin-left: 6px; } .monitor i:nth-child(3) { width: 85%; margin-left: 6px; } .monitor i:nth-child(4) { width: 30%; }
.desk.working .monitor i { background: var(--term-ok); opacity: 1; animation: code 1.8s ease-in-out infinite; }
.desk.working .monitor i:nth-child(2) { animation-delay: .3s; background: var(--term-cmd); }
.desk.working .monitor i:nth-child(3) { animation-delay: .6s; }
.desk.working .monitor i:nth-child(4) { animation-delay: .9s; background: var(--term-cmd); }
.desk.blocked .monitor { border-color: var(--signal); }
@keyframes code { 0%, 100% { transform: scaleX(.35); } 50% { transform: scaleX(1); } }
.table { display: block; width: 150px; max-width: 100%; height: 12px; background: var(--desk); border-bottom: 4px solid var(--desk-edge); border-radius: 4px; margin-top: -4px; }
.desk.working .seat { animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.desk.blocked .avc { box-shadow: 0 0 0 3px var(--signal); }
.desk.paused .seat, .desk.paused .monitor { filter: grayscale(1); opacity: .6; }
.plate { display: flex; flex-direction: column; align-items: center; margin-top: 8px; }
.plate b { font-size: 14px; } .plate span { font-size: 12px; color: var(--muted); }
.mini { margin-top: 6px; }
.bubble { position: absolute; top: 8px; left: 50%; z-index: 2; transform: translate(-50%, 6px) scale(.95); max-width: calc(100% - 12px); background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0;
  transition: opacity .2s, transform .2s; box-shadow: 0 4px 12px -6px rgba(0,0,0,.3); pointer-events: none; }
.bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.desk.blocked .bubble { background: var(--signal-soft); color: var(--signal); border-color: var(--signal); font-weight: 600; animation: nudge 2s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -3px); } }
.zz { position: absolute; top: 36px; left: calc(50% - 30px); font-family: var(--display); font-weight: 700; color: var(--muted); font-size: 14px; animation: zz 2.4s ease-in-out infinite; }
.zz b { font-size: 10px; margin-left: 2px; vertical-align: super; }
@keyframes zz { 0% { opacity: 0; transform: translateY(6px); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
.desk.empty .table { opacity: .5; }
.traits { display: grid; gap: 6px; }
.trait { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 10px; font-size: 13px; }
.trait .bar { width: 100%; }
.quirk { margin: 10px 0 4px; }

/* New company wizard */
.ob { position: absolute; inset: 38px 0 0 0; background: var(--bg); z-index: 4; overflow: auto; display: grid; place-items: start center; padding: 40px 16px; }
.obcard { width: min(640px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 18px; }
.obcard h2 { font-family: var(--display); font-size: 26px; margin: 2px 0 4px; letter-spacing: -.01em; text-wrap: balance; }
.obcard p { margin: 0; }
.stepl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--accent); }
.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); transition: background .2s; }
.steps i.on { background: var(--accent); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field textarea { border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface-2); resize: vertical; }

  const x = c.getContext("2d"), cols = ["#2b55c9", "#1f8a55", "#e0a33a", "#d9577a", "#8a6bd1"];

function renderDrawer() {
  const d = $("#drawer"), open = !!S.drawer;
  d.classList.toggle("open", open); $("#scrim").classList.toggle("open", open); d.setAttribute("aria-hidden", !open);
  if (!open) return;
  d.innerHTML = S.drawer.type === "person" ? drawerPerson(P(S.drawer.id)) : drawerTicket(S.tickets.find(t => t.id === S.drawer.id));
  const term = $("#term"); if (term) term.scrollTop = term.scrollHeight;
}

function go(view) { S.view = view; try { history.replaceState(null, "", "#" + view); } catch (e) {} render(); }
function pushFeed(w, m, need) {
  S.feed.unshift({ w, at: now(), m, need }); S.feed = S.feed.slice(0, 40);
  const f = $("#feed"); if (f) { f.insertAdjacentHTML("afterbegin", feedItem(S.feed[0], true)); }
}

function resolveAsk(id, ok) {
  const a = S.inbox.find(x => x.id === id); if (!a) return;
  S.inbox = S.inbox.filter(x => x.id !== id);
  const p = P(a.from);
  if (a.id === 1 && ok) {
    const t = S.tickets.find(x => x.id === a.ticket); if (t) { t.col = "done"; t.needs = false; }
    p.status = "working"; p.ticket = "ACM-12"; p.now = "Reviewing ACM-12 magic link"; S.term.odile.push(["c", "$ gh pr merge 39 --squash"], ["ok", "merged into main"], ["d", "› crew.get_ticket ACM-12"]);
    S.chans.eng.push({ w: "odile", at: now(), m: "Merged #39. Moving on to review ACM-12.", ref: "ACM-11" });
    S.people.find(x => x.id === "sam").status = "working"; Object.assign(P("sam"), { ticket: "ACM-13", now: "Drafting the pricing launch post" });
    SCRIPTS.sam = [["d", "› crew.get_ticket ACM-11"], ["d", "› reading web/src/pages/pricing.tsx"], ["d", "› drafting posts/pricing-launch.md"], ["d", "› crew.attach_artifact ACM-13 pricing-launch.md", "Sam drafted the pricing launch post"]];
    cheer(p, 5000); say(p, "Shipped! On to ACM-12.", 4500); say(P("sam"), "Finally! Writing the launch post.", 4500); setTimeout(confetti, 80);
    toast("Merged #39. Sam picked up the launch post.");
    pushFeed("odile", "You approved the merge. Odile merged #39 pricing page");
  } else if (a.id === 3 && ok) { p.budget = 2.5; toast("Lina's budget is now $2.50 a day"); pushFeed("lina", "You raised Lina's budget to $2.50"); }
  else { toast(`Answered ${p.name.split(" ")[0]}: ${ok ? a.ok : (a.alt || "Rejected")}`); pushFeed(a.from, `You answered ${p.name.split(" ")[0]}: ${ok ? a.ok : (a.alt || "rejected")}`); }
  render();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-view],[data-person],[data-ticket],[data-chan],[data-close],[data-ok],[data-alt],[data-hire],[data-interview],[data-dm],[data-pause],[data-newco],[data-obnext],[data-obback],[data-obcancel],[data-obfinish],[data-tpl]");
  if (e.target.id === "scrim") { S.drawer = null; renderDrawer(); return; }
  if (!el) return;
  const d = el.dataset;
  if (d.newco) newCompany();
  else if (d.obnext) { obRead(); S.ob.step++; render(); }
  else if (d.obback) { obRead(); S.ob.step--; render(); }
  else if (d.obcancel) { S.ob = null; render(); }
  else if (d.obfinish) finishOnboard();
  else if (d.tpl) { S.ob.tpl = d.tpl; render(); }
  else if (d.view) go(d.view);
  else if (d.person) { S.drawer = { type: "person", id: d.person }; renderDrawer(); }
  else if (d.ticket) { S.drawer = { type: "ticket", id: d.ticket }; renderDrawer(); }
  else if (d.chan) { S.chan = d.chan; render(); }
  else if ("close" in d) { S.drawer = null; renderDrawer(); }
  else if (d.ok) resolveAsk(+d.ok, true);
  else if (d.alt) resolveAsk(+d.alt, false);
  else if (d.interview) toast(`${CANDS[d.interview].name} is doing a 10 minute test task in a throwaway worktree`);
  else if (d.hire) {
    const c = CANDS[d.hire], id = c.name.split(" ")[0].toLowerCase() + S.people.length;
    S.people.push({ id, name: c.name, role: c.role.split(",")[0], hue: c.hue, rt: c.rt, model: c.model, status: "idle", ticket: null, now: "Just joined. Reading the repo and docs", spend: 0, budget: c.cost,
      bio: c.quote, memory: ["Joined today", "Onboarding: read README, CONTRIBUTING, docs/"], shipped: 0, review: "–", perms: { terminal: true, push: "approval", network: false } });
    S.term[id] = [["c", "$ git clone acme-notes"], ["d", "› reading README.md"]]; S.step[id] = 0;
    MGR[id] = /engineer|dev/i.test(c.role) ? "odile" : "rui";
    PERSONA[id] = { traits: { Chatty: Math.random(), Bold: Math.random(), Picky: Math.random() }, quirk: c.style + ".", desk: "Still unpacking",
      lines: [c.quote, "Still learning the codebase.", "Where's the coffee?"] };
    pushFeed(id, `${c.name} joined as ${c.role.split(",")[0]}`);
    toast(`Hired ${c.name}`); go("floor"); say(P(id), "Hi everyone!", 4000);
  }
  else if (d.dm) { S.drawer = null; S.chan = "eng"; go("chat"); const i = $("#chatin"); if (i) { i.value = "@" + P(d.dm).name.split(" ")[0] + " "; i.focus(); } }
  else if (d.pause) { const p = P(d.pause); p.status = p.status === "paused" ? (p.ticket ? "working" : "idle") : "paused"; render(); }
});
document.addEventListener("input", e => { if (e.target.id === "ob-pay") $("#ob-payv").textContent = money(+e.target.value); });
document.addEventListener("change", e => {
  if (e.target.dataset.rt) { const p = P(e.target.dataset.rt); p.rt = e.target.value; p.model = { claude: "sonnet", codex: "gpt-5-codex", pi: "gemini-pro", native: "haiku" }[p.rt];
    S.term[p.id].push(["d", `› runtime switched to ${RT[p.rt].label}. Session resumes from ticket context`]); toast(`${p.name.split(" ")[0]} now runs on ${RT[p.rt].label}`); render(); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "hireform") { makeCands($("#rolein").value.trim() || "Engineer"); render(); return; }
  if (e.target.id === "compose") {
    const v = $("#chatin").value.trim(); if (!v) return;
    S.chans[S.chan].push({ w: "you", at: now(), m: v });
    const mention = S.people.find(p => v.toLowerCase().includes("@" + p.name.split(" ")[0].toLowerCase()));
    render();
    if (mention) setTimeout(() => { S.chans[S.chan].push({ w: mention.id, at: now(), m: "On it. I'll add this to my current ticket notes and reply in the thread when done." }); if (S.view === "chat") render(); }, 1400);
  }
});
$("#runbtn").addEventListener("click", () => { S.running = !S.running; toast(S.running ? "Company resumed" : "Everyone paused. Nothing will spend money."); render(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.drawer) { S.drawer = null; renderDrawer(); } });

setInterval(() => {
  if (!S.running) return;
  const working = S.people.filter(p => p.status === "working" && SCRIPTS[p.id]);
  if (!working.length) return;
  const p = working[Math.floor(Math.random() * working.length)];
  const sc = SCRIPTS[p.id], line = sc[S.step[p.id] % sc.length]; S.step[p.id]++;
  S.term[p.id].push([line[0], line[1]]);
  const cost = 0.01 + Math.random() * 0.03; p.spend += cost; S.spend += cost;
  if (line[2]) pushFeed(p.id, line[2]);
  const per = PERSONA[p.id];
  if (/passed, 0 failed|built \d+|merged/.test(line[1])) { cheer(p); say(p, pick(["All green!", "Nailed it.", "Yes!"])); }
  else if (line[0] === "err") say(p, "Hmm. That's not right.");
  else if (per && (line[2] || Math.random() < .25)) say(p, pick(per.lines));
  renderTop();
  if (S.drawer && S.drawer.type === "person" && S.drawer.id === p.id) { const t = $("#term"); if (t) { t.innerHTML = termHTML(p.id); t.scrollTop = t.scrollHeight; } }
  if (S.view === "office" && line[2] === undefined) {
    const card = document.querySelector(`.card[data-person="${p.id}"] .foot span`); if (card) card.textContent = `${money(p.spend)} / ${money(p.budget)}`;
  }
}, 1600);

const h = location.hash.slice(1); if (VIEWS[h]) S.view = h;
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== S.view) go(v); });
render();
</script>
